line-length = 100
target-version = "py310"

# Keep prose and doc snippets out of the formatter's way.
exclude = ["**/*.md"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501", # line length is handled by ruff format
]

[lint.per-file-ignores]
"tests/**" = ["B011"]
